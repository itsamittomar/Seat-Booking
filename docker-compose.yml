# Local stack: identical image to the deployed one, plus Postgres.
#   docker compose up --build
#   make burst BASE_URL=http://localhost:8080 ADMIN_TOKEN=dev-admin-token
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 2s
      retries: 30
    # not published to the host; use: docker compose exec db psql -U booking

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://booking:booking@db:5432/booking?sslmode=disable
      TOKEN_SECRET: dev-secret-change-me
      ADMIN_TOKEN: dev-admin-token
      DB_MAX_CONNS: "20"
      PORT: "8080"
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "8080:8080"
